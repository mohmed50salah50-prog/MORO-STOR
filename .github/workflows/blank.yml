name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q MoroStoreApp.zip
      - run: cd MoroStoreApp && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MoroStore-APK
          path: MoroStoreApp/app/build/outputs/apk/debug/*.apk
